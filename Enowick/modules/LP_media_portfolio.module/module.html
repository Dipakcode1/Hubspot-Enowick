<!-- Digital Media Portfolio -->
<section class="py-section-gap {{name}}" id="media-portfolio">
  <div class="max-w-container-max mx-auto px-gutter">

    <div class="text-center mb-16">
      <p class="text-primary-container font-bold uppercase tracking-widest text-xs mb-4">
        {{ module.eyebrow }}
      </p>

      <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight section-heading">
        {{ module.heading }}
      </h2>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">

      {% for item in module.media_items %}
      <div class="group relative overflow-hidden rounded-xl aspect-square bg-surface-container shadow-lg">

        {% if item.media_image.src %}
        <img
          src="{{ item.media_image.src }}"
          alt="{{ item.media_image.alt|escape }}"
          class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"
          loading="lazy">
        {% endif %}

        <div class="absolute inset-0 bg-inverse-surface/80 opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-6">

          <span class="text-primary-container text-xs font-bold uppercase mb-2">
            {{ item.category }}
          </span>

          <h4 class="text-white font-bold">
            {{ item.title }}
          </h4>

          <p class="text-white/70 text-xs mt-2">
            {{ item.client }}
          </p>

        </div>

      </div>
      {% endfor %}

    </div>

  </div>
</section>

{% require_css %}
<style>
  .{{ name }} .section-heading {
    max-width: 550px;
    margin: 0 auto 40px;
    display: block;
    text-align: center;
    font-weight: 700;
    font-size: 2.25rem;
    line-height: 1.2;
  }

  @media (max-width: 767px) {
    .{{ name }} .section-heading {
      max-width: 100%;
      font-size: 2rem;
      margin-bottom: 32px;
    }
  }
</style>
{% end_require_css %}
